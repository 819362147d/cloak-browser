workflows:
  build-unsigned-ipa:
    name: Build unsigned IPA
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build unsigned archive
        script: |
          xcodebuild archive \
            -project CloakBrowser.xcodeproj \
            -scheme CloakBrowser \
            -configuration Release \
            -archivePath build/CloakBrowser.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/CloakBrowser.xcarchive/Products/Applications/CloakBrowser.app Payload/
          zip -r CloakBrowser-unsigned.ipa Payload
    artifacts:
      - CloakBrowser-unsigned.ipa
